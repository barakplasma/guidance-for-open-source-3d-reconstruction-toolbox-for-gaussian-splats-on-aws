name: Infracost

on:
  pull_request:
    paths: [deployment/terraform/**, .github/workflows/infracost.yml]

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: deployment/terraform

jobs:
  infracost:
    runs-on: ubuntu-latest
    steps:
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Baseline (PR base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - run: infracost breakdown --path=$TF_DIR --format=json --out-file=/tmp/base.json

      - name: PR branch
        uses: actions/checkout@v4
      - run: infracost diff --path=$TF_DIR --compare-to=/tmp/base.json --format=json --out-file=/tmp/diff.json

      - name: Comment on PR
        run: >
          infracost comment github --path=/tmp/diff.json
          --repo=$GITHUB_REPOSITORY
          --github-token=${{ github.token }}
          --pull-request=${{ github.event.pull_request.number }}
          --behavior=update

      - name: Absolute monthly cost (job summary)
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          infracost breakdown --path=$TF_DIR --format=table --no-color >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
